# Copy to ~/.baileys-cc-bridge/<your number>/config.yaml. `baileys-cc-bridge chats` lists the JIDs you can use.

# Every message in these chats goes to that chat's own agent session. Everything else is ignored.
chats:
  # Your own "Message yourself" chat: a private line to your agent.
  - jid: 6281234567890@s.whatsapp.net   # a phone number such as "+62 812-3456-7890" works too
    name: Me
    engine: claude                      # claude (default) | codex
    autonomy: full                      # full (default: no prompts, no sandbox) | auto (the engine's own reviewer) | readonly
    model: ""                           # "" = the CLI's default

  - jid: 120363012345678901@g.us
    name: Project group
    engine: codex
    footer: false                          # no "Assisted by Codex" under its messages (on by default)
    workdir: ~/Projects/Personal/scratch   # default: ~/.baileys-cc-bridge/<number>/chats/<chat>
    # system_prompt follows the bridge's own fixed instructions; groups and direct chats each have
    # a default (the panel shows them).
