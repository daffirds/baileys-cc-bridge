# Copy to ~/.bailey-cc-bridge/config.yaml. `bailey-cc-bridge chats` lists the JIDs you can use.

# Every message in these chats goes to that chat's own agent session. Everything else is ignored.
chats:
  # Your own "Message yourself" chat: a private line to your agent.
  - jid: 6281234567890@s.whatsapp.net   # a phone number such as "+62 812-3456-7890" works too
    name: Me
    engine: claude                      # claude (default) | codex
    autonomy: auto                      # auto (default: the engine's own reviewer) | full (no prompts) | readonly
    model: ""                           # "" = the CLI's default

  - jid: 120363012345678901@g.us
    name: Project group
    engine: codex
    workdir: ~/Projects/Personal/scratch   # default: ~/.bailey-cc-bridge/chats/<chat>
    prompt: |
      You help in this group. Only answer when someone asks you something.
