<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d">
<title id="t">How a message reaches the agent and its answer comes back</title>
<desc id="d">Your message in the WhatsApp group is steered into the agent's Claude Code session on your Mac. The agent runs commands there, then its tool calls come back as the chat's next bubbles: send_message as Mochi Bot's answer, send_file as the PDF, and react as the heart on Rina's thanks, after her message is steered in too.</desc>
