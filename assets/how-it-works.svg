<text x="500" y="206" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#e9edef"><tspan fill="#8696a0">·</tspan><tspan dx="8">one session per chat</tspan></text>
<text x="500" y="234" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#e9edef"><tspan fill="#8696a0">·</tspan><tspan dx="8">messages steered in mid-turn</tspan></text>
<text x="500" y="262" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#e9edef"><tspan fill="#8696a0">·</tspan><tspan dx="8">tools bound to the chat</tspan></text>
