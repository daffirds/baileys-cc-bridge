<rect x="66" y="216" width="236" height="46" rx="9" fill="#202c33" stroke="#233138" stroke-width="1"/>
<text x="76" y="233" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d97757">Claude 🤖</text>
<text x="76" y="252" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#e9edef">Found 3, all free Fri–Sun 🏡</text>
<rect x="66" y="270" width="236" height="46" rx="9" fill="#202c33" stroke="#233138" stroke-width="1"/>
<text x="76" y="287" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d97757">Claude 🤖</text>
<text x="76" y="306" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#e9edef">📄 ubud-villas.pdf</text>
<text x="66" y="342" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8696a0">only what the agent sends</text>
<rect x="476" y="120" width="328" height="180" rx="16" fill="#111b21" stroke="#233138" stroke-width="1.5"/>
<circle cx="500" cy="147" r="5" fill="#e9edef"/>
