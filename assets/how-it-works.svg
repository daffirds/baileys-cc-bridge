<text x="944" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8696a0">$ curl -s villas.example/ubud</text>
<text x="944" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8696a0">$ python make_pdf.py</text>
<text x="944" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8696a0">✎ ubud-villas.pdf</text>
<text x="944" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#d97757">⚙ send_message &quot;Found 3…&quot;</text>
<text x="944" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#d97757">⚙ send_file ubud-villas.pdf</text>
<text x="930" y="342" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8696a0">thinking, commands and logs stay here</text>
