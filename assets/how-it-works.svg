<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
<title id="t">How baileys-cc-bridge works</title>
<desc id="d">People message the WhatsApp number. The bridge passes each message to that chat's Claude Code or Codex session on your Mac, steering it into the turn already running. The agent thinks, runs commands and edits files on the Mac, and acts on WhatsApp only through tool calls: those, and nothing else, come back to the chat as messages, files and reactions.</desc>
