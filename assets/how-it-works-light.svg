<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="652" viewBox="0 0 1280 652" role="img" aria-labelledby="t d">
<title id="t">How a message reaches the agent and its answer comes back</title>
<desc id="d">Every message in the WhatsApp group goes into the agent's Claude Code session on your Mac; it stays quiet on Ben's. On yours it opens GrabFood in the browser and fills a cart, and reacts to Rina's extra cheese on the way. Its tool calls come back as the chat's next bubbles: send_file as the cart screenshot asking whether to order, and after your go, send_message as Mochi Bot's order confirmation.</desc>
